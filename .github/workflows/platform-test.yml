name: platform-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Smoke test (local checkout)
        run: node tests/smoke.js

  npx-install:
    name: npx install from GitHub (${{ matrix.os }})
    needs: smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test client dependencies
        run: npm install --no-audit --no-fund
      - name: Run the exact README command (macOS)
        if: runner.os == 'macOS'
        run: node tests/smoke.js npx -y github:${{ github.repository }}#${{ github.sha }}
      - name: Run the exact README command (Windows)
        if: runner.os == 'Windows'
        run: node tests/smoke.js cmd /c npx -y github:${{ github.repository }}#${{ github.sha }}
